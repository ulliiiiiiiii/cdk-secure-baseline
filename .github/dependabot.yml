version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the native compiler, ts-jest does not run on it yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
